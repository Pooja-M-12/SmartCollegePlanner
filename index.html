<!DOCTYPE html>
<html>
<head>
    <title>Smart College Planner</title>
    <style>
        body { 
            font-family: Arial; 
            background: #eef2f7; 
            padding: 40px; 
        }
        .container { 
            background: white; 
            width: 400px; 
            margin: auto; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 { 
            text-align: center; 
            color: #2c3e50; 
        }
        label { 
            font-weight: bold; 
            display: block; 
            margin-top: 15px; 
        }
        input, select { 
            width: 100%; 
            padding: 8px; 
            margin-top: 5px; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
        }
        button { 
            margin-top: 20px; 
            width: 100%; 
            padding: 10px; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer;
        }
        button:hover { 
            background: #2980b9; 
        }
        a { 
            text-decoration: none; 
            display: block; 
            text-align: center; 
            margin-top: 10px; 
            color: #3498db; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Smart College Planner</h2>
        <form action="/add" method="get">
            <label>Task</label>
            <input type="text" name="task" required>
            
            <label>Difficulty</label>
            <select name="difficulty">
                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>
            </select>
            
            <label>Deadline</label>
            <input type="date" name="deadline" required>
            
            <button type="submit">Add Task</button>
        </form>
        <a href="/tasks">View All Tasks</a>
    </div>
</body>
</html>
