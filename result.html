<!DOCTYPE html>
<html>
<head>
    <title>Task Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            width: 50%;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: green;
        }

        p {
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: green;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        a:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>✅ Task Added Successfully</h2>

    <p>Your task has been processed.</p>
    <p><b>Priority is calculated using Java logic.</b></p>

    <p>
        This Smart College Planner helps you focus on
        important and urgent academic tasks.
    </p>

    <a href="/">⬅ Go Back to Home</a>
</div>

</body>
</html>
